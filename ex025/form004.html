<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
    <h1>exemplo de formulario</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>informaçoes pessoais</legend>
            <p>
                <label for="nome">nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="50" placeholder="nome completo" autocomplete="off">
            </p>
            <p>
                <label for="iemail">e-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email">
            </p>
            <p>
                <label for="tel">telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^(/d{2}/)[0-9]{4-5}$" required placeholder="(00) 00000-0000">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
