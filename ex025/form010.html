<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p>
            <label for="iano">que ano voce nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" value="2000" oninput="calcIdade">
        </p>
        <p>
            <label for="Iidade">sua idade e:</label>
            <output id="Iidade">0</output>
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            Iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
