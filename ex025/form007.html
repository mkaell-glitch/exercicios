<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iest">estado</label>
            <select name="estado" id="iest">
                <option value="">---escolha---</option>
                <optgroup label="regioes">
                    <option value="SP">sao paulo</option>
                    <option value="RS">rio grande do sul</option>
                    <option value="MG">minas gerais</option>
                    <option value="RJ">rio de janeiro</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">profissao:</label>
            <input type="text" name="prof" id="iprof" list="listprofs">
            <datalist id="listprofs">
                <option value="ADM">administrador</option>
                <option value="DEV">desenvolvedor</option>
                <option value="PROF">professor</option>
            </datalist>
        </p>
        <p>
            <label for="imsg">sugestoes ou DENUNCIAS</label> <br>
            <textarea placeholder="sua mensagem aqui!" name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>
        <p>
            <input type="reset" value="limpar">
            <input type="submit" value="enviar">
        </p>
    </form>
</body>
</html>
